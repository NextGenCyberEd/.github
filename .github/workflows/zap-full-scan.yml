name: ZAP Full Scan (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Absolute URL to scan (non-production only)
        type: string
        required: true
      rules-file-name:
        description: Path to ZAP rules TSV relative to repo root
        type: string
        required: false
        default: ".zap/rules.tsv"
      fail-action:
        description: Fail the job when ZAP reports alerts (after rules)
        type: boolean
        required: false
        default: true
      cmd-options:
        description: Extra zap-full-scan.py flags
        type: string
        required: false
        default: "-m 10"
      artifact-name:
        description: GitHub Actions artifact name for the report
        type: string
        required: false
        default: "zap-full-scan"
    secrets:
      vercel-protection-bypass:
        description: Vercel Protection Bypass for Automation (x-vercel-protection-bypass)
        required: false

jobs:
  zap-full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Vercel protection bypass
        id: bypass
        env:
          BYPASS: ${{ secrets.vercel-protection-bypass }}
          TARGET: ${{ inputs.target }}
          EXTRA_CMD: ${{ inputs.cmd-options }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "cmd_options<<EOF"
              echo "${EXTRA_CMD}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::vercel-protection-bypass secret unset; Deployment Protection may block the scan"
            exit 0
          fi
          host="$(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["TARGET"]).hostname or "")')"
          if [ -z "$host" ]; then
            echo "::error::Could not parse hostname from target URL"
            exit 1
          fi

          tmp="$(mktemp)"
          set +e
          code="$(curl -sS -L --location-trusted --max-redirs 20 --max-time 60 \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            -H "x-vercel-set-bypass-cookie: true" \
            -o "$tmp" -w "%{http_code}" \
            "$TARGET")"
          curl_ec=$?
          set -e
          if [ "$curl_ec" -ne 0 ] || [ "$code" != "200" ]; then
            echo "::error::Vercel bypass probe failed (curl_ec=${curl_ec:-n/a} HTTP ${code:-n/a})"
            exit 1
          fi

          replacer='-z "-config replacer.full_list(0).description=vercel-set-bypass-cookie -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=x-vercel-set-bypass-cookie -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=true"'
          {
            echo "cmd_options<<EOF"
            if [ -n "${EXTRA_CMD}" ]; then
              echo "${EXTRA_CMD} ${replacer}"
            else
              echo "${replacer}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "site=$host" >> "$GITHUB_OUTPUT"

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        env:
          ZAP_AUTH_HEADER: ${{ steps.bypass.outputs.enabled == 'true' && 'x-vercel-protection-bypass' || '' }}
          ZAP_AUTH_HEADER_VALUE: ${{ secrets.vercel-protection-bypass }}
          # Unscoped: site-scoped matching has missed spider paths and bounced
          # through Vercel SSO (Feature-Policy / rule 10063-2).
          ZAP_AUTH_HEADER_SITE: ""
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          target: ${{ inputs.target }}
          rules_file_name: ${{ inputs.rules-file-name }}
          fail_action: ${{ inputs.fail-action }}
          allow_issue_writing: false
          artifact_name: ${{ inputs.artifact-name }}
          cmd_options: ${{ steps.bypass.outputs.cmd_options }}
