name: Dependency Audit (Reusable)

# Flags known-vulnerable dependencies. Supports a subdirectory via
# working-directory input. Consuming repo sets cadence (PR + weekly) in caller.

on:
  workflow_call:
    inputs:
      audit-level:
        type: string
        default: "high"
      working-directory:
        type: string
        default: "."
      # When true, skip devDependency advisories (e.g. eslint toolchain).
      # Use when a high/critical has no upstream patch and only affects build tools.
      omit-dev:
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: npm audit
        working-directory: ${{ inputs.working-directory }}
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          OMIT_DEV: ${{ inputs.omit-dev }}
        run: |
          set -euo pipefail
          args=(--audit-level="${AUDIT_LEVEL}")
          if [ "${OMIT_DEV}" = "true" ]; then
            args+=(--omit=dev)
          fi
          npm audit "${args[@]}"
