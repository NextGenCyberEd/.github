name: ZAP Baseline (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Absolute URL to scan
        type: string
        required: true
      rules-file-name:
        description: Path to ZAP rules TSV relative to repo root
        type: string
        required: false
        default: ".zap/rules.tsv"
      fail-action:
        description: Fail the job when ZAP reports alerts (after rules)
        type: boolean
        required: false
        default: true
      cmd-options:
        description: Extra zap-baseline.py flags
        type: string
        required: false
        default: ""
      artifact-name:
        description: GitHub Actions artifact name for the report
        type: string
        required: false
        default: "zap-baseline"

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          target: ${{ inputs.target }}
          rules_file_name: ${{ inputs.rules-file-name }}
          fail_action: ${{ inputs.fail-action }}
          allow_issue_writing: false
          artifact_name: ${{ inputs.artifact-name }}
          cmd_options: ${{ inputs.cmd-options }}
